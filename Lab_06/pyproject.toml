[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tested-book-catalog"
version = "0.6.0"
description = "Lab 6 variant 2 automated testing of a book catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
authors = [{name = "Бровді Олександр"}]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24"]
report = ["python-docx>=1.1", "Pillow>=10"]

[project.scripts]
book-catalog = "book_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=book_catalog --cov-branch --cov-report=term-missing --cov-report=html --cov-report=json --cov-report=xml --cov-fail-under=90"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real file and application integration", "unit: isolated component behavior"]

[tool.coverage.run]
branch = true
source = ["book_catalog"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["^if __name__ == .__main__.:", '^ *\.\.\.$']

[tool.ruff]
target-version = "py311"
line-length = 88
